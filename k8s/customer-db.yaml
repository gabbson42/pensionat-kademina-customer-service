apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-db
  template:
    metadata:
      labels:
        app: customer-db
    spec:
      containers:
        - name: mysql
          image: mysql:8
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: gabbe123
            - name: MYSQL_DATABASE
              value: customer_db
            - name: MYSQL_USER
              value: springUser
            - name: MYSQL_PASSWORD
              value: secretPassword
          ports:
            - containerPort: 3306

---

apiVersion: v1
kind: Service
metadata:
  name: customer-db
spec:
  selector:
    app: customer-db
  ports:
    - port: 3306
      targetPort: 3306